# Aggiornamenti automatici: ogni mese GitHub apre le PR per le librerie (Gradle)
# e per le azioni dei workflow che hanno una versione nuova.
# Per ogni ecosistema gli aggiornamenti minor e patch arrivano in un'unica PR;
# ogni aggiornamento major ha la sua PR, da controllare e unire a mano.
# La build di Actions controlla ogni PR; dependabot-merge.yml unisce da solo
# le PR solo minor/patch quando la build è passata.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Queste versioni richiedono AGP 9.1 e compileSdk 37: togliere quando si passa ad AGP 9
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19.0"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">= 2.10.0"]
      - dependency-name: "androidx.lifecycle:lifecycle-runtime-compose"
        versions: [">= 2.11.0"]
      - dependency-name: "androidx.lifecycle:lifecycle-viewmodel-compose"
        versions: [">= 2.11.0"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
