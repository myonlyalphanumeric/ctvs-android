name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Facoltativo: se nei secrets c'è una chiave di firma vera la usa,
      # altrimenti l'APK viene firmato con la chiave di sviluppo del repository.
      - name: Chiave di firma (se configurata)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Uso la chiave di firma dei secrets"
          else
            echo "Nessuna chiave nei secrets: uso app/dev.keystore"
          fi

      - name: Test e compilazione
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Rinomina APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/citiverse-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: citiverse-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # Pubblica l'APK in una release, così si scarica dal telefono senza login su GitHub.
      # Per i branch la release "apk-<branch>" viene sostituita a ogni build.
      - name: Pubblica release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" dist/*.apk --title "Citiverse $TAG" --notes "APK firmato, pronto da installare." || \
              gh release upload "$TAG" dist/*.apk --clobber
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
            TAG="apk-${BRANCH}"
            gh release delete "$TAG" --cleanup-tag --yes || true
            gh release create "$TAG" dist/*.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Citiverse build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
              --notes "Build automatica del commit ${GITHUB_SHA::7} sul branch ${GITHUB_REF_NAME}. Scarica il file .apk qui sotto e installalo sul telefono (consenti l'installazione da origini sconosciute)."
          fi
