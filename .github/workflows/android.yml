name: Build APK

on:
  push:
    # I branch di Dependabot vengono compilati dalla loro PR, senza pubblicare release.
    branches: ['**', '!dependabot/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      track:
        description: 'Canale di Google Play: internal = test interno, alpha = test chiuso, production = tutti'
        type: choice
        options: [internal, alpha, production]
        default: alpha

permissions:
  contents: write
  # Per l'accesso a Google Play senza chiavi (federazione delle identità con il token OIDC di GitHub)
  id-token: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nessuno step usa git con le credenziali: la release passa da gh con GH_TOKEN.
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Facoltativo: se nei secrets c'è una chiave di firma vera la usa,
      # altrimenti l'APK viene firmato con la chiave di sviluppo del repository.
      - name: Chiave di firma (se configurata)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Uso la chiave di firma dei secrets"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Le versioni (tag v*) vanno firmate con la chiave vera: aggiungi RELEASE_KEYSTORE_BASE64 ai secrets"
            exit 1
          else
            echo "Nessuna chiave nei secrets: uso app/dev.keystore"
          fi

      - name: Test e compilazione
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease bundleRelease

      - name: Rinomina APK
        run: |
          mkdir -p dist store
          cp app/build/outputs/apk/release/app-release.apk "dist/citiverse-${GITHUB_RUN_NUMBER}.apk"
          # AAB per il Play Store (firmato con la chiave di caricamento)
          cp app/build/outputs/bundle/release/app-release.aab "store/citiverse-${GITHUB_RUN_NUMBER}.aab"
          ls -la dist
          # Impronte da pubblicare, per controllare che l'APK scaricato sia proprio questo.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          {
            echo "SHA-256 del file: $(sha256sum dist/*.apk | cut -d' ' -f1)"
            echo "Certificato di firma: $("$APKSIGNER" verify --print-certs dist/*.apk | grep -m1 'SHA-256' | sed 's/.*: //')"
          } | tee dist/impronte.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: citiverse-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          # Gli artifact restano 7 giorni: lo spazio del piano gratuito per i repo privati è 500 MB.
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: citiverse-aab-${{ github.run_number }}
          path: store/*.aab
          if-no-files-found: error
          retention-days: 7

      # Pubblicazione su Google Play: ogni push sul branch principale va nel test chiuso (alpha);
      # da Actions → Run workflow si sceglie il canale (test chiuso o produzione).
      # Accesso senza chiavi: GitHub presenta a Google un token firmato che vale solo per questo
      # repository e Google risponde con un permesso che scade dopo un'ora.
      # Da Run workflow si pubblica solo se il workflow è avviato dal branch principale.
      - name: Google Play saltato (avvio manuale da un altro branch)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::notice::Google Play: pubblicazione saltata, il workflow è stato avviato a mano da '${GITHUB_REF}' e non dal branch principale '${DEFAULT_BRANCH}'. Per pubblicare avvialo da '${DEFAULT_BRANCH}'."

      - name: Accesso a Google Play (senza chiavi)
        id: gplay
        if: >-
          vars.GCP_WIF_PROVIDER != '' &&
          ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Pubblica su Google Play
        if: >-
          (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.gplay.outputs.access_token }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: it.citiverse.app
          TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'alpha' }}
        run: |
          if [ -z "$PLAY_ACCESS_TOKEN" ] && [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Google Play: pubblicazione saltata, accesso a Google non configurato (variabili GCP_WIF_PROVIDER e GCP_SERVICE_ACCOUNT)"
            exit 0
          fi
          if [ -z "${RELEASE_KEYSTORE:-}" ]; then
            echo "::warning::Google Play: pubblicazione saltata, l'AAB non è firmato con la chiave vera"
            exit 0
          fi
          # Note di rilascio: changelogs/<numero build>.txt se c'è, altrimenti default.txt
          NOTES=fastlane/metadata/android/it-IT/changelogs
          if [ -f "$NOTES/${GITHUB_RUN_NUMBER}.txt" ]; then
            export RELEASE_NOTES_FILE="$NOTES/${GITHUB_RUN_NUMBER}.txt"
          else
            export RELEASE_NOTES_FILE="$NOTES/default.txt"
          fi
          bash .github/scripts/play-upload.sh "store/citiverse-${GITHUB_RUN_NUMBER}.aab" "$TRACK" "1.0.${GITHUB_RUN_NUMBER}"

      # Pubblica l'APK in una release, così si scarica dal telefono senza login su GitHub.
      # Per i branch la release "apk-<branch>" viene sostituita a ogni build.
      - name: Pubblica release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" dist/*.apk store/*.aab --title "Citiverse $TAG" --notes "APK firmato, pronto da installare.

          $(cat dist/impronte.txt)" || \
              gh release upload "$TAG" dist/*.apk store/*.aab --clobber
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
            TAG="apk-${BRANCH}"
            gh release delete "$TAG" --cleanup-tag --yes || true
            gh release create "$TAG" dist/*.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Citiverse build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
              --notes "Build automatica del commit ${GITHUB_SHA::7} sul branch ${GITHUB_REF_NAME}. Scarica il file .apk qui sotto e installalo sul telefono (consenti l'installazione da origini sconosciute).

          $(cat dist/impronte.txt)"
          fi
